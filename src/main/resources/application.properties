sb.version=@project.version@
sb.tick.cron=0 0 0 * * *
spring.mail.host=mail.your-server.de
spring.mail.port=587
spring.mail.username=noreply@battleforhonor.de
spring.mail.password=pNO6MmiC89a40wdH
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# exception mailing
logging.mail.exceptions=true
# spring logging
logging.level.org.springframework.web=debug
# Database setup
spring.datasource.url=jdbc:mariadb://localhost:3306/sbdb
spring.datasource.username=${DB_USERNAME:karsten}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=org.hibernate.dialect.MariaDB53Dialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=250
# really needed ? spring.datasource.hikari.max-lifetime=580000
# sql logging
#spring.jpa.show-sql=true
#logging.level.org.hibernate.SQL=debug
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace
# DDL
spring.jpa.properties.javax.persistence.validation.mode=auto
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDB53Dialect
spring.jpa.properties.hibernate.hbm2ddl.delimiter=;
spring.jpa.properties.hibernate.show_sql=false
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.properties.javax.persistence.schema-generation.scripts.action=drop-and-create
spring.jpa.properties.javax.persistence.schema-generation.scripts.create-target=/tmp/createSBDB.sql
spring.jpa.properties.javax.persistence.schema-generation.scripts.drop-target=/tmp/dropSBDB.sql
spring.jpa.properties.javax.persistence.validation.group.pre-update=de.yuga.spacebattle.backend.validators.SpringValidation
spring.jpa.properties.javax.persistence.validation.group.pre-persist=de.yuga.spacebattle.backend.validators.SpringValidation
spring.jpa.properties.javax.persistence.validation.group.pre-remove=de.yuga.spacebattle.backend.validators.SpringValidation
# Logging
logging.rest.calls=false
logging.battle-log.write=false
logging.file.name=/tmp/spacebattle.log
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS,Europe/Berlin
# Maximum of archive log files to keep. Only supported with the default logback setup.
logging.logback.rollingpolicy.max-history=50
# Maximum log file size. Only supported with the default logback setup.
logging.logback.rollingpolicy.max-file-size=100MB
# Whether to enable access log rotation.
server.tomcat.accesslog.rotate=true
# Whether to enable access log rotation.
server.undertow.accesslog.rotate=true
#logging.pattern.file=%d %p %c{1.} [%t] %m%n
#logging.pattern.console=%d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n
## if no active profile, default is 'default'
##spring.profiles.active=prod
# necessary by change to springdoc without swagger ui
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
db-patch-folder=data/sql/delta/
